name: tests
on: [push, pull_request]

jobs:
  linux-tunnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config
      - run: make -C src test
      - run: make -C src
      - run: sudo bash ./tests/tunnel_test.sh

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install libsodium pkg-config
      - run: make -C src test
      - run: make -C src

  deploy:
    needs: [linux-tunnel, macos-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Deploy to EC2
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          KNOWN: ${{ secrets.KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes ubuntu@"$HOST"